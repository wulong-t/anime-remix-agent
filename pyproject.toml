[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-remix-agent"
version = "0.1.0"
description = "Anime Remix Agent: script + clips -> editable timeline -> MP4"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0,<3",
    "typer>=0.12,<1",
]

[project.scripts]
anime-remix = "anime_remix.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
ignore = ["B008"]
